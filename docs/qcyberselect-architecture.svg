<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#071321"/><stop offset="1" stop-color="#0b2236"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="720" rx="24" fill="#040a12"/><text x="70" y="70" fill="#8eeaff" font-family="Arial" font-size="30" font-weight="800">Q-CyberSelect Experimental Architecture</text><text x="70" y="108" fill="#8ca8bb" font-family="Arial" font-size="17">A reproducible path from network traffic to a compact intrusion-detection representation</text><g font-family="Arial"><rect x="60" y="160" width="245" height="390" rx="22" fill="url(#a)" stroke="#22d7ff" stroke-width="2"/><text x="85" y="205" fill="#60e5ff" font-size="20" font-weight="700">01 • DATA</text><text x="85" y="246" fill="#fff" font-size="28" font-weight="800">UNSW-NB15</text><text x="85" y="285" fill="#b6cad8" font-size="17">175k training rows</text><text x="85" y="312" fill="#b6cad8" font-size="17">82k testing rows</text><text x="85" y="356" fill="#b6cad8" font-size="16">42 predictors</text><text x="85" y="388" fill="#b6cad8" font-size="16">Binary attack label</text><text x="85" y="438" fill="#7ff1ff" font-size="15">Preprocessing</text><text x="85" y="466" fill="#b6cad8" font-size="15">Imputation • encoding</text><text x="85" y="492" fill="#b6cad8" font-size="15">Numeric/categorical handling</text><rect x="345" y="160" width="245" height="390" rx="22" fill="url(#a)" stroke="#3d9dff" stroke-width="2"/><text x="370" y="205" fill="#8bb6ff" font-size="20" font-weight="700">02 • GRAPH</text><text x="370" y="246" fill="#fff" font-size="28" font-weight="800">Feature Graph</text><g stroke="#45dfff" stroke-width="2" fill="none" filter="url(#g)"><circle cx="440" cy="340" r="10"/><circle cx="495" cy="300" r="10"/><circle cx="545" cy="355" r="10"/><circle cx="468" cy="420" r="10"/><circle cx="525" cy="445" r="10"/><path d="M440 340L495 300L545 355L525 445L468 420Z M440 340L545 355 M495 300L468 420"/></g><text x="370" y="490" fill="#b6cad8" font-size="15">Relevance + redundancy</text><text x="370" y="516" fill="#b6cad8" font-size="15">mapped to quadratic terms</text><rect x="630" y="160" width="300" height="390" rx="22" fill="url(#a)" stroke="#7a70ff" stroke-width="2"/><text x="655" y="205" fill="#a89dff" font-size="20" font-weight="700">03 • OPTIMIZATION</text><text x="655" y="246" fill="#fff" font-size="28" font-weight="800">QUBO → QAOA</text><text x="655" y="292" fill="#b6cad8" font-size="16">Binary decision variables</text><text x="655" y="320" fill="#b6cad8" font-size="16">Cardinality-constrained subset</text><text x="655" y="348" fill="#b6cad8" font-size="16">Variational quantum circuit</text><g transform="translate(655,390)"><rect width="55" height="70" rx="8" fill="#132b46" stroke="#45dfff"/><text x="20" y="43" fill="#fff" font-size="20">H</text><rect x="72" width="70" height="70" rx="8" fill="#2a2250" stroke="#9f8dff"/><text x="88" y="43" fill="#fff" font-size="16">Rγ</text><rect x="154" width="70" height="70" rx="8" fill="#3d2147" stroke="#ff8fb5"/><text x="169" y="43" fill="#fff" font-size="16">Rβ</text></g><rect x="970" y="160" width="245" height="390" rx="22" fill="url(#a)" stroke="#6e9dff" stroke-width="2"/><text x="995" y="205" fill="#9dbaff" font-size="20" font-weight="700">04 • SELECTION</text><text x="995" y="246" fill="#fff" font-size="28" font-weight="800">4 of 42</text><text x="995" y="284" fill="#67e7ff" font-size="24" font-weight="800">90.48% reduction</text><rect x="995" y="320" width="190" height="155" rx="14" fill="#081522" stroke="#3cdfff"/><text x="1015" y="355" fill="#fff" font-size="20" font-weight="700">Frozen set</text><text x="1015" y="390" fill="#bdeeff" font-size="16">sttl</text><text x="1015" y="417" fill="#bdeeff" font-size="16">ct_state_ttl</text><text x="1015" y="444" fill="#bdeeff" font-size="16">dload</text><text x="1015" y="471" fill="#bdeeff" font-size="16">rate</text><rect x="1255" y="160" width="285" height="390" rx="22" fill="url(#a)" stroke="#37d69b" stroke-width="2"/><text x="1280" y="205" fill="#57ebb0" font-size="20" font-weight="700">05 • EVALUATION</text><text x="1280" y="246" fill="#fff" font-size="28" font-weight="800">IDS Model</text><text x="1280" y="292" fill="#b6cad8" font-size="16">Locked test benchmark</text><text x="1280" y="320" fill="#b6cad8" font-size="16">Classical baselines</text><text x="1280" y="348" fill="#b6cad8" font-size="16">Cross-validation</text><text x="1280" y="376" fill="#b6cad8" font-size="16">Robustness stress tests</text><text x="1280" y="432" fill="#67e7ff" font-size="18" font-weight="700">Metrics</text><text x="1280" y="460" fill="#b6cad8" font-size="15">F1 • ROC-AUC • PR-AUC</text><text x="1280" y="487" fill="#b6cad8" font-size="15">Balanced accuracy • MCC</text><g stroke="#5b7ca0" stroke-width="3"><path d="M305 355H345"/><path d="M590 355H630"/><path d="M930 355H970"/><path d="M1215 355H1255"/></g><g fill="#5b7ca0"><path d="M338 347l12 8-12 8z"/><path d="M623 347l12 8-12 8z"/><path d="M963 347l12 8-12 8z"/><path d="M1248 347l12 8-12 8z"/></g></g><text x="70" y="635" fill="#9ab2c4" font-family="Arial" font-size="17">Evaluation principle: feature-selection configurations are frozen before the held-out test split is used.</text></svg>