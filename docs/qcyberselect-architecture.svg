<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<rect width="1600" height="760" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<text x="70" y="70" font-size="32" font-weight="800">Experimental Architecture</text>
<text x="70" y="104" font-size="17" fill="#555">A reproducible pipeline from network traffic to an optimization-derived feature subset.</text>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<g stroke="#111" fill="#fff" stroke-width="2">
<rect x="60" y="160" width="260" height="420" rx="16"/><rect x="350" y="160" width="260" height="420" rx="16"/>
<rect x="640" y="160" width="300" height="420" rx="16"/><rect x="970" y="160" width="260" height="420" rx="16"/><rect x="1260" y="160" width="280" height="420" rx="16"/>
</g>
<g fill="#111">
<text x="84" y="205" font-size="15" font-weight="700">01 • DATA</text><text x="84" y="250" font-size="28" font-weight="800">UNSW-NB15</text>
<text x="84" y="290" font-size="16">175,341 training rows</text><text x="84" y="317" font-size="16">82,332 testing rows</text><text x="84" y="352" font-size="16">42 predictors</text><text x="84" y="385" font-size="16">Binary intrusion target</text><text x="84" y="445" font-size="14" fill="#555">Preprocessing</text><text x="84" y="470" font-size="14">Imputation</text><text x="84" y="494" font-size="14">Categorical encoding</text><text x="84" y="518" font-size="14">Numeric handling</text>
<text x="374" y="205" font-size="15" font-weight="700">02 • RELATIONSHIPS</text><text x="374" y="250" font-size="28" font-weight="800">Feature Graph</text>
<text x="374" y="292" font-size="16">Nodes represent predictors.</text><text x="374" y="318" font-size="16">Edges encode feature relationships.</text><text x="374" y="344" font-size="16">Relevance and redundancy</text><text x="374" y="370" font-size="16">shape the combinatorial objective.</text>
<text x="664" y="205" font-size="15" font-weight="700">03 • OPTIMIZATION</text><text x="664" y="250" font-size="28" font-weight="800">QUBO → QAOA</text>
<text x="664" y="292" font-size="16">Binary selection variables</text><text x="664" y="318" font-size="16">Fixed-cardinality constraint</text><text x="664" y="344" font-size="16">Quadratic objective</text>
<rect x="664" y="390" width="64" height="72" rx="8" fill="#111"/><text x="688" y="435" font-size="20" fill="#fff">H</text>
<rect x="744" y="390" width="82" height="72" rx="8" fill="#fff" stroke="#111"/><text x="764" y="435" font-size="16" fill="#111">Rγ</text>
<rect x="842" y="390" width="82" height="72" rx="8" fill="#111"/><text x="863" y="435" font-size="16" fill="#fff">Rβ</text>
<text x="664" y="505" font-size="14" fill="#555">QAOA solution quality is checked</text><text x="664" y="528" font-size="14" fill="#555">against exact optimization where tractable.</text>
<text x="994" y="205" font-size="15" font-weight="700">04 • SELECTION</text><text x="994" y="250" font-size="28" font-weight="800">4 of 42</text><text x="994" y="290" font-size="22" font-weight="800">90.48% reduction</text>
<rect x="994" y="330" width="212" height="160" rx="10" fill="#111"/><text x="1016" y="368" font-size="17" font-weight="700" fill="#fff">Frozen QAOA set</text><text x="1016" y="405" font-size="16" fill="#fff">sttl</text><text x="1016" y="431" font-size="16" fill="#fff">ct_state_ttl</text><text x="1016" y="457" font-size="16" fill="#fff">dload</text><text x="1016" y="483" font-size="16" fill="#fff">rate</text>
<text x="1284" y="205" font-size="15" font-weight="700">05 • EVALUATION</text><text x="1284" y="250" font-size="28" font-weight="800">Intrusion Detection</text><text x="1284" y="292" font-size="16">Locked held-out test</text><text x="1284" y="320" font-size="16">Classical selector baselines</text><text x="1284" y="348" font-size="16">Cross-validation</text><text x="1284" y="376" font-size="16">Seed stability</text><text x="1284" y="404" font-size="16">Structured perturbations</text><text x="1284" y="432" font-size="16">Pairwise robustness ablation</text><text x="1284" y="490" font-size="15" font-weight="700">Metrics</text><text x="1284" y="516" font-size="14" fill="#555">F1 • Balanced accuracy • ROC-AUC</text><text x="1284" y="540" font-size="14" fill="#555">PR-AUC • MCC • precision • recall</text>
</g>
