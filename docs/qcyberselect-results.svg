<rect x="125" y="199" width="105" height="411"/><text x="152" y="180">0.894</text>
<rect x="270" y="229" width="105" height="381"/><text x="297" y="210">0.829</text>
<rect x="415" y="193" width="105" height="417"/><text x="442" y="174">0.908</text>
<rect x="560" y="221" width="105" height="389"/><text x="587" y="202">0.848</text>
