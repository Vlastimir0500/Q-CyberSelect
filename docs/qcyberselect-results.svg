<rect x="850" y="207" width="105" height="403"/><text x="877" y="188">0.879</text>
</g>
<g font-family="Arial" font-size="14" fill="#111" text-anchor="middle"><text x="177" y="645">All-42</text><text x="322" y="645">QAOA-4</text><text x="467" y="645">MI-4</text><text x="612" y="645">ANOVA-4</text><text x="757" y="645">L1-4</text><text x="902" y="645">RF-4</text></g>
<g font-family="Arial" fill="#111">
<rect x="1050" y="145" width="460" height="500" fill="#fff" stroke="#111" stroke-width="2" rx="16"/>
<text x="1080" y="190" font-size="24" font-weight="800">Reference values</text>
<text x="1080" y="235" font-size="17">QAOA-4</text><text x="1240" y="235" font-size="17" font-weight="700">F1 0.829355</text><text x="1370" y="235" font-size="14" fill="#555">ROC-AUC 0.850748</text>
<text x="1080" y="275" font-size="17">MI-4</text><text x="1240" y="275" font-size="17" font-weight="700">F1 0.908461</text><text x="1370" y="275" font-size="14" fill="#555">ROC-AUC 0.969565</text>
<text x="1080" y="315" font-size="17">RF-4</text><text x="1240" y="315" font-size="17" font-weight="700">F1 0.878545</text><text x="1370" y="315" font-size="14" fill="#555">ROC-AUC 0.957890</text>
<text x="1080" y="355" font-size="17">All-42</text><text x="1240" y="355" font-size="17" font-weight="700">F1 0.894034</text><text x="1370" y="355" font-size="14" fill="#555">ROC-AUC 0.980430</text>
<line x1="1080" y1="390" x2="1480" y2="390" stroke="#111"/>
<text x="1080" y="430" font-size="17" font-weight="700">Compact representation</text>
<text x="1080" y="463" font-size="18">42 → 4 predictors</text>
<text x="1080" y="493" font-size="18">90.48% feature reduction</text>
<text x="1080" y="540" font-size="14" fill="#555">The locked test does not establish</text>
<text x="1080" y="562" font-size="14" fill="#555">predictive superiority for QAOA.</text>
<text x="1080" y="584" font-size="14" fill="#555">The study evaluates QAOA as an</text>
<text x="1080" y="606" font-size="14" fill="#555">optimization-based feature selector.</text>
