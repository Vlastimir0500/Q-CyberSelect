<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="24" fill="#050b12"/><text x="70" y="70" fill="#8eeaff" font-family="Arial" font-size="30" font-weight="800">Locked Test Performance — UNSW-NB15</text><text x="70" y="105" fill="#8ca8bb" font-family="Arial" font-size="17">Frozen feature-selection configurations evaluated with the same Random Forest classifier</text><line x1="90" y1="610" x2="990" y2="610" stroke="#49657b"/><line x1="90" y1="150" x2="90" y2="610" stroke="#49657b"/><g font-family="Arial" fill="#668195" font-size="14"><text x="56" y="615">0.0</text><text x="56" y="500">0.25</text><text x="56" y="385">0.50</text><text x="56" y="270">0.75</text><text x="56" y="155">1.0</text></g><g font-family="Arial" font-size="15" font-weight="700"><rect x="130" y="199" width="100" height="411" rx="8" fill="#6ed2ff"/><text x="154" y="182" fill="#7fdfff">0.894</text><rect x="270" y="229" width="100" height="381" rx="8" fill="#3da6ef"/><text x="294" y="212" fill="#7fdfff">0.829</text><rect x="410" y="193" width="100" height="417" rx="8" fill="#7b8dff"/><text x="434" y="176" fill="#9ca9ff">0.908</text><rect x="550" y="221" width="100" height="389" rx="8" fill="#a29ae8"/><text x="574" y="204" fill="#d0caff">0.848</text><rect x="690" y="224" width="100" height="386" rx="8" fill="#7e9fba"/><text x="714" y="207" fill="#b6d0e0">0.839</text><rect x="830" y="207" width="100" height="403" rx="8" fill="#b1bed1"/><text x="854" y="190" fill="#d7e4ef">0.879</text></g><g font-family="Arial" fill="#b7c9d7" font-size="15" text-anchor="middle"><text x="180" y="645">All-42</text><text x="320" y="645">QAOA-4</text><text x="460" y="645">MI-4</text><text x="600" y="645">ANOVA-4</text><text x="740" y="645">L1-4</text><text x="880" y="645">RF-4</text></g><g transform="translate(1060,155)" font-family="Arial"><rect width="460" height="430" rx="22" fill="#0a1825" stroke="#24445e"/><text x="32" y="55" fill="#fff" font-size="24" font-weight="800">Locked-test reference values</text><text x="32" y="105" fill="#8eeaff" font-size="18">QAOA-4</text><text x="210" y="105" fill="#fff" font-size="18" font-weight="700">F1 0.8294</text><text x="330" y="105" fill="#a6bfd0" font-size="14">ROC-AUC 0.8507</text><text x="32" y="150" fill="#8eeaff" font-size="18">MI-4</text><text x="210" y="150" fill="#fff" font-size="18" font-weight="700">F1 0.9085</text><text x="330" y="150" fill="#a6bfd0" font-size="14">ROC-AUC 0.9696</text><text x="32" y="195" fill="#8eeaff" font-size="18">RF-4</text><text x="210" y="195" fill="#fff" font-size="18" font-weight="700">F1 0.8785</text><text x="330" y="195" fill="#a6bfd0" font-size="14">ROC-AUC 0.9579</text><text x="32" y="240" fill="#8eeaff" font-size="18">All-42</text><text x="210" y="240" fill="#fff" font-size="18" font-weight="700">F1 0.8940</text><text x="330" y="240" fill="#a6bfd0" font-size="14">ROC-AUC 0.9804</text><text x="32" y="295" fill="#6ff5bc" font-size="18">Compression</text><text x="210" y="295" fill="#fff" font-size="18" font-weight="700">42 → 4</text><text x="330" y="295" fill="#6ff5bc" font-size="16">90.48%</text><line x1="32" y1="330" x2="428" y2="330" stroke="#24445e"/><text x="32" y="365" fill="#a6bfd0" font-size="15">Interpretation</text><text x="32" y="392" fill="#d4e5ef" font-size="15">QAOA provides a compact four-feature</text><text x="32" y="416" fill="#d4e5ef" font-size="15">representation. The locked test does not</text><text x="32" y="440" fill="#d4e5ef" font-size="15">establish predictive superiority over the</text><text x="32" y="464" fill="#d4e5ef" font-size="15">evaluated classical selectors.</text></g></svg>